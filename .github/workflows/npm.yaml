---
name: npm

# Publishes the plugin to npm at each version tag (v0.1.0 → 0.1.0). npm trusts this workflow
# (trusted publishing, OpenID Connect): there is no token to keep and no one-time password,
# and every version carries provenance that links it to this repository and run.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    if: github.repository == 'dpoposki/tabby-workspaces'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 24 ships npm 11, which trusted publishing needs.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match package.json version $version: run npm version first."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      # prepublishOnly typechecks and builds. Verbose, because npm logs why trusted publishing
      # failed only at that level, then reports just ENEEDAUTH.
      - name: Publish
        run: npm publish --access public --provenance --loglevel verbose
